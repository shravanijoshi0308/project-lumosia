<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lumosia</title>
  <style>
    body {
      background: transparent;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;   
      align-items: flex-start;   
    }
    .picker {
      display: flex;
      gap: 8px;
      padding: 16px;
}
    .picker button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
}   
    .hang {
      display: flex; flex-direction: column; align-items: center;
      transform-origin: top center;
    }
    .thread {
      width: 2px;
      height: 10px;      /* ← long thread. Bigger number = hangs lower */
      background: linear-gradient(#d9b44a, #b8860b);
    }
    .charm { height: 140px; }         /* no animation by default = hangs still */
    .hang.swing { animation: sway 2.5s ease-in-out; }   /* note: NO 'infinite' → plays once */

    @keyframes sway {
      0%   { transform: rotate(0deg); }
      8%   { transform: rotate(-5deg); }
      16%  { transform: rotate(4deg); }
      24%  { transform: rotate(-2deg); }
      32%  { transform: rotate(1deg); }
      40%, 100% { transform: rotate(0deg); }   /* hangs still for the rest */

    }
  </style>
</head>
<body>
  <div class="hang" id="hang">
    <div class="thread"></div>
    <img id="charm" class="charm" src="charms/evileye-classic.png" alt="charm">
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const charm = document.getElementById('charm');
    const hang  = document.getElementById('hang');

    // switch charm from the menu bar
    ipcRenderer.on('set-charm', (e, file) => { charm.src = 'charms/' + file; });

    // only catch clicks while the cursor is over the charm (rest stays click-through)
    charm.addEventListener('mouseenter', () => ipcRenderer.send('set-ignore', false));
    charm.addEventListener('mouseleave', () => ipcRenderer.send('set-ignore', true));

    // dangle ONCE when clicked
    charm.addEventListener('click', () => {
      hang.classList.remove('swing');
      void hang.offsetWidth;          // trick to restart the animation
      hang.classList.add('swing');
    });
  </script>
</body>
</html>
