<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DrustiChuka</title>
  <style>
    body {
      background: #24406b;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;   
      align-items: flex-start;   
    }

    .charm {
      height: 140px;                
      transform-origin: top center;  
      animation: sway 4s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(6deg); }
    }
  </style>
</head>
<body>
  <img class="charm" src="charms/nazar.png" alt="Nazar">
</body>
</html>
